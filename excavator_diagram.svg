<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Ground -->
  <line x1="0" y1="350" x2="600" y2="350" stroke="#666" stroke-width="2"/>
  
  <!-- Pivot point (center of rotation) -->
  <circle cx="100" cy="300" r="8" fill="#444"/>
  <text x="100" y="330" text-anchor="middle" font-size="12" fill="#888">Pivot</text>
  
  <!-- Boom pin offset from pivot -->
  <line x1="100" y1="300" x2="140" y2="270" stroke="#666" stroke-width="2" stroke-dasharray="4"/>
  <circle cx="140" cy="270" r="5" fill="#666"/>
  <text x="120" y="255" font-size="10" fill="#888">Boom pin</text>
  
  <!-- Boom A -->
  <line x1="140" y1="270" x2="280" y2="180" stroke="#e74c3c" stroke-width="6"/>
  <circle cx="280" cy="180" r="5" fill="#c0392b"/>
  <text x="200" y="200" font-size="12" fill="#e74c3c">Boom A</text>
  
  <!-- Boom B -->
  <line x1="280" y1="180" x2="380" y2="140" stroke="#e67e22" stroke-width="6"/>
  <circle cx="380" cy="140" r="5" fill="#d35400"/>
  <text x="320" y="135" font-size="12" fill="#e67e22">Boom B</text>
  
  <!-- Stick (hanging down) -->
  <line x1="380" y1="140" x2="420" y2="280" stroke="#f1c40f" stroke-width="6"/>
  <circle cx="420" cy="280" r="8" fill="#f39c12" stroke="#fff" stroke-width="2"/>
  <text x="430" y="210" font-size="12" fill="#f1c40f">Stick</text>
  <text x="435" y="285" font-size="10" fill="#f39c12">Coupler pivot</text>
  
  <!-- Coupler (rotates on pivot, has tilt sensor) -->
  <line x1="420" y1="280" x2="450" y2="320" stroke="#9b59b6" stroke-width="5"/>
  <circle cx="450" cy="320" r="4" fill="#8e44ad"/>
  <text x="460" y="300" font-size="10" fill="#9b59b6">Coupler 37mm</text>
  <text x="460" y="312" font-size="9" fill="#9b59b6">(tilt sensor)</text>
  
  <!-- Bucket (fixed to coupler, same angle) -->
  <line x1="450" y1="320" x2="490" y2="370" stroke="#3498db" stroke-width="5"/>
  <circle cx="490" cy="370" r="4" fill="#2980b9"/>
  <text x="500" y="350" font-size="10" fill="#3498db">Bucket 60mm</text>
  <text x="500" y="362" font-size="9" fill="#3498db">(follows coupler)</text>
  <text x="480" y="385" font-size="12" fill="#2980b9" font-weight="bold">Tip</text>
  
  <!-- Angle indicator for coupler rotation -->
  <line x1="420" y1="280" x2="420" y2="340" stroke="#aaa" stroke-width="1" stroke-dasharray="3"/>
  <path d="M 420 310 A 30 30 0 0 1 445 315" stroke="#9b59b6" fill="none" stroke-width="2"/>
  <text x="380" y="330" font-size="9" fill="#9b59b6">Tilt angle</text>
  
  <!-- Legend -->
  <rect x="10" y="10" width="200" height="110" fill="#222" rx="5"/>
  <text x="20" y="30" font-size="11" fill="#fff" font-weight="bold">Kinematic chain:</text>
  <text x="20" y="50" font-size="10" fill="#e74c3c">1. Boom A (sensor)</text>
  <text x="20" y="65" font-size="10" fill="#e67e22">2. Boom B (sensor)</text>
  <text x="20" y="80" font-size="10" fill="#f1c40f">3. Stick (sensor, points down)</text>
  <text x="20" y="95" font-size="10" fill="#9b59b6">4. Coupler (tilt sensor, 37mm)</text>
  <text x="20" y="110" font-size="10" fill="#3498db">5. Bucket (no sensor, 60mm)</text>
</svg>
